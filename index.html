<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WOLF LABS | The Daily Vlog (Dark Mode)</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgBase: '#0F172A',       
                        panelDark: '#1E293B',    
                        panelHover: '#334155',   
                        textMain: '#F8FAFC',     
                        textMuted: '#94A3B8',    
                        accentBlue: '#38BDF8',   
                        accentPink: '#F472B6',   
                        dangerRed: '#EF4444'     
                    },
                    fontFamily: {
                        epic: ['Outfit', 'sans-serif'],
                        ui: ['Nunito', 'sans-serif'],
                        hand: ['Caveat', 'cursive']
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #0F172A; color: #F8FAFC; overflow: hidden; font-family: 'Nunito', sans-serif; 
            transition: background-color 1s ease; 
            background-image: 
                radial-gradient(at 0% 0%, rgba(244, 114, 182, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.05) 0px, transparent 50%);
        }
        
        /* Immersive Shift Class */
        body.immersive-shift { background-color: #2A0F15; background-image: radial-gradient(at 50% 50%, rgba(239, 68, 68, 0.1) 0px, transparent 50%);}
        body.immersive-shift .ws-panel { border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 10px 40px rgba(239, 68, 68, 0.15); }
        body.immersive-shift .text-accentBlue { color: #EF4444; }
        
        /* Cinematic Dark Mode / Glassmorphism */
        .ws-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        
        .glow-text-blue { text-shadow: 0 0 15px rgba(56, 189, 248, 0.6); }
        .glow-text-pink { text-shadow: 0 0 15px rgba(244, 114, 182, 0.6); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        @keyframes fadeOut { to { opacity: 0; pointer-events: none; } }
        .fade-out { animation: fadeOut 0.8s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes damageShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-15px); } 40%, 80% { transform: translateX(15px); } }
        .damage-shake { animation: damageShake 0.4s ease-in-out; }
        @keyframes slideDown { 0% { transform: translateY(-100%); opacity: 0; } 10%, 90% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100%); opacity: 0; } }
        .praise-slide { animation: slideDown 3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .teacher-drawer { position: fixed; top: 0; right: -400px; width: 400px; height: 100vh; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(25px); z-index: 200; transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-left: 1px solid rgba(56, 189, 248, 0.2); }
        .teacher-drawer.open { right: 0; }

        .lever-track { width: 120px; height: 40px; background: #0F172A; border-radius: 20px; position: relative; cursor: pointer; border: 1px solid #334155; }
        .lever-thumb { width: 50px; height: 32px; background: #38BDF8; border-radius: 16px; position: absolute; top: 3px; left: 4px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .lever-track.toggled .lever-thumb { left: 64px; background: #F472B6; box-shadow: 0 0 15px rgba(244, 114, 182, 0.4); }

        .progress-bar-fill { transition: width 0.3s ease; }

        .btn-social { background: linear-gradient(135deg, #38BDF8, #2563EB); color: white; border-radius: 100px; font-family: 'Outfit', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; transition: transform 0.2s, box-shadow 0.2s; border: none; cursor: pointer; box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3); }
        .btn-social:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(56, 189, 248, 0.4); }
        
        .follow-up-box { background-color: rgba(56, 189, 248, 0.05); border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.2); }

        /* Social Media Feed Styles (Dark Mode) */
        .vlog-post { background: #1E293B; border-radius: 32px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); transition: transform 0.3s; }
        .vlog-post:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.7); border-color: rgba(56, 189, 248, 0.3); }
        .vlog-image { width: 100%; aspect-ratio: 16/9; background: linear-gradient(135deg, #0F172A, #1E293B); display: flex; align-items: center; justify-content: center; font-size: 5rem; position: relative; overflow: hidden;}
        .vlog-image::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.3), transparent 50%); }
        
        .vocab-link { color: #38BDF8; font-weight: 800; border-bottom: 2px dashed #38BDF8; cursor: pointer; transition: all 0.2s; position: relative; padding: 0 4px; border-radius: 4px;}
        .vocab-link:hover { background: rgba(56, 189, 248, 0.15); text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        .vocab-link.active { color: #F472B6; border-bottom-color: #F472B6; background: rgba(244, 114, 182, 0.1); }
    </style>
</head>
<body class="flex flex-col h-screen select-none relative">
    
    <!-- 1. LOADING SCREEN -->
    <div id="loading-screen" class="fixed inset-0 z-[1000] bg-bgBase flex flex-col items-center justify-center">
        <div class="text-accentBlue text-6xl mb-6 glow-text-blue animate-bounce"><i class="fas fa-mobile-alt"></i></div>
        <h1 class="font-epic text-4xl text-textMain tracking-widest mb-12 uppercase">STUDIO INITIATING</h1>
        <button onclick="initializeSystem()" class="btn-social px-10 py-4 text-xl">GO LIVE</button>
    </div>

    <!-- DAMAGE OVERLAY -->
    <div id="damage-overlay" class="fixed inset-0 z-[800] bg-dangerRed/20 border-8 border-dangerRed opacity-0 pointer-events-none transition-opacity duration-100 flex items-center justify-center">
        <i class="fa-solid fa-heart-crack text-9xl text-dangerRed opacity-50"></i>
    </div>

    <!-- PRAISE OVERLAY -->
    <div id="praise-overlay" class="fixed top-0 left-0 w-full z-[900] flex justify-center pointer-events-none transform -translate-y-full">
        <div id="praise-card" class="mt-10 bg-accentPink text-white px-12 py-6 rounded-b-[2rem] shadow-[0_20px_50px_rgba(244,114,182,0.4)] border-4 border-t-0 border-white text-center">
            <h2 id="praise-text" class="font-epic text-4xl md:text-5xl font-black uppercase tracking-wider mb-2">TRENDING!</h2>
            <p id="praise-sub" class="font-ui text-lg font-bold tracking-[0.2em] uppercase">Followers +100</p>
        </div>
    </div>

    <!-- TEACHER DRAWER -->
    <div id="teacher-panel" class="teacher-drawer p-6 flex flex-col">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-epic text-2xl text-accentBlue tracking-tight uppercase"><i class="fas fa-video mr-2"></i> Director</h2>
            <button onclick="toggleTeacherPanel()" class="text-textMuted hover:text-white"><i class="fa-solid fa-xmark text-2xl"></i></button>
        </div>
        <textarea id="teacher-notes" class="flex-1 bg-bgBase border border-panelHover rounded-2xl p-5 font-hand text-2xl text-textMain focus:border-accentPink outline-none resize-none mb-6" placeholder="> Take notes on student's pronunciation and grammar..."></textarea>
        <div class="space-y-3">
            <p class="font-ui text-xs text-textMuted tracking-widest uppercase font-bold">Live Reactions</p>
            <button onclick="triggerPraise('VIRAL!', 'PERFECT GRAMMAR')" class="w-full py-3 bg-accentBlue/10 border border-accentBlue text-accentBlue rounded-xl hover:bg-accentBlue hover:text-bgBase transition-colors font-epic tracking-widest uppercase">Send: Like (Grammar)</button>
            <button onclick="triggerPraise('TRENDING!', 'GREAT VOCABULARY')" class="w-full py-3 bg-accentPink/10 border border-accentPink text-accentPink rounded-xl hover:bg-accentPink hover:text-bgBase transition-colors font-epic tracking-widest uppercase">Send: Love (Vocab)</button>
        </div>
    </div>

    <!-- TOP HUD -->
    <header class="h-20 ws-panel border-b-0 border-x-0 rounded-none z-100 flex items-center justify-between px-8 shrink-0 relative z-40">
        <div class="flex items-center gap-8">
            <div id="health-bar" class="flex gap-2 text-2xl text-accentPink drop-shadow-[0_0_8px_rgba(244,114,182,0.6)]">
                <i class="fa-solid fa-heart" id="hp-1"></i><i class="fa-solid fa-heart" id="hp-2"></i><i class="fa-solid fa-heart" id="hp-3"></i>
            </div>
            <div class="flex flex-col">
                <span class="font-ui text-[10px] text-textMuted uppercase tracking-widest font-bold">Followers</span>
                <span id="xp-counter" class="font-epic text-xl text-accentBlue glow-text-blue font-bold">0000</span>
            </div>
        </div>
        <div class="absolute left-1/2 -translate-x-1/2 text-center">
            <p id="hud-name" class="font-epic font-bold text-textMain tracking-[0.2em] uppercase">@GUEST_USER</p>
            <p class="font-ui text-[10px] text-accentPink tracking-widest uppercase font-bold"><i class="fas fa-circle text-[8px] text-dangerRed animate-pulse mr-1"></i> The Daily Vlog (A1)</p>
        </div>
        <button onclick="toggleTeacherPanel()" class="font-epic text-xs bg-panelHover px-5 py-2.5 rounded-full hover:bg-accentBlue hover:text-white transition-colors tracking-widest uppercase border border-slate-600"><i class="fa-solid fa-bars mr-2"></i> Menu</button>
    </header>

    <!-- MAIN ARENA -->
    <main id="arena" class="flex-1 relative overflow-y-auto overflow-x-hidden flex items-center justify-center p-4 md:p-8">
        <div id="step-container" class="w-full max-w-5xl transition-all duration-300 relative z-10 h-full flex flex-col justify-center pb-20"></div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <footer class="h-20 ws-panel border-t-0 border-x-0 rounded-none z-100 flex items-center justify-between px-8 shrink-0 relative z-40">
        <div class="w-1/3">
            <div class="w-full bg-bgBase h-2 rounded-full overflow-hidden border border-panelHover">
                <div id="progress-fill" class="h-full bg-gradient-to-r from-accentBlue to-accentPink transition-all duration-500" style="width: 4%"></div>
            </div>
        </div>
        <div class="w-1/3 text-center">
            <span id="page-counter" class="font-epic text-textMuted text-sm tracking-[0.2em]">POST 01 / 25</span>
        </div>
        <div class="w-1/3 flex justify-end gap-4">
            <button id="btn-prev" onclick="nav(-1)" class="w-12 h-12 rounded-full bg-panelHover text-textMain flex items-center justify-center hover:bg-slate-600 disabled:opacity-20 transition-all"><i class="fa-solid fa-chevron-left"></i></button>
            <button id="btn-next" onclick="nav(1)" class="w-12 h-12 rounded-full bg-accentBlue text-bgBase flex items-center justify-center hover:scale-110 shadow-[0_0_15px_rgba(56,189,248,0.4)] transition-all"><i class="fa-solid fa-chevron-right text-xl"></i></button>
        </div>
    </footer>

    <script>
        // --- STATE MANAGEMENT ---
        let state = { step: 0, hp: 3, xp: 0, studentName: "@GUEST_USER", totalSteps: 25, mechanics: {} };

        // UI HELPER: Speaking Prompt Box
        const buildSpeakingPrompt = (q, starter) => {
            if(!q) return '';
            return `
                <div class="mt-8 follow-up-box p-6 flex items-start gap-6 text-left fade-in border-l-4 border-accentBlue">
                    <div class="w-12 h-12 rounded-full bg-accentBlue/20 flex items-center justify-center shrink-0 border border-accentBlue/30">
                        <i class="fa-solid fa-microphone-lines text-2xl text-accentBlue animate-pulse"></i>
                    </div>
                    <div>
                        <p class="font-epic text-textMuted text-xs tracking-widest uppercase mb-1 font-bold">Director's Prompt</p>
                        <p class="font-ui text-xl text-textMain font-bold mb-3">"${q}"</p>
                        <p class="font-hand text-accentPink text-2xl tracking-wide">"${starter}"</p>
                    </div>
                </div>`;
        };

        // --- LESSON DATA (ACT I to V - EXACTLY 25 PAGES - A1 CONTROLLED VOCAB) ---
        const lesson = [
            // ACT I: Setup & Briefing
            { type: 'cover', title: 'THE DAILY VLOG', subtitle: 'Dark Mode Edition', desc: 'A1 Level. Master Daily Routines and the Present Simple.', icon: 'fa-video' },
            { type: 'idReg', title: 'CREATE YOUR HANDLE', desc: 'Enter your social media username to start the vlog.' },
            { type: 'mcqVibe', title: 'CONTENT STRATEGY', q: 'Are you productive in the morning or at night?', options: ['🌅 I wake up early. I am a Morning Person.', '🦉 I go to bed late. I am a Night Owl.', '☕ I just need coffee.'], followUpQ: 'Why do you prefer this time?', starter: '"I like the morning/night because..."' },
            { type: 'debate', title: 'VIBE CHECK', q: 'If you are a famous vlogger, what do you record? (Games, Food, Travel?)', starter: '"My videos are about..."' },
            
            // ACT II: Fluency Toolkit (Input) - EASY READERS & FEED POSTS
            { type: 'matchVocab', title: 'LINK IN BIO', pairs: [{w:'Wake up', d:'Open your eyes in the morning.'}, {w:'Commute', d:'Travel to work or school.'}, {w:'Chill', d:'Relax and do nothing.'}] },
            
            { type: 'easyReaderFeed', title: 'MORNING ROUTINE', 
              postIcon: 'fa-sun', likes: '15.2K', time: '07:30 AM', 
              text: 'Good morning guys! I always <span class="vocab-link" onclick="openVocabModal(this, \'Wake Up\', \'Open your eyes in the morning.\', \'What time do you usually wake up?\', \'I usually wake up at...\')">wake up</span> at 7 AM. I drink coffee and eat bread. Then, I <span class="vocab-link" onclick="openVocabModal(this, \'Commute\', \'Travel to work or school.\', \'How do you commute to work/school?\', \'I usually commute by (bus/car)...\')">commute</span> to the studio by bus.', 
              defaultFollowUp: 'Read the post aloud to the Director.' },
              
            { type: 'easyReaderFeed', title: 'EVENING ROUTINE', 
              postIcon: 'fa-moon', likes: '22.8K', time: '08:00 PM', 
              text: 'Long day! I finish work at 6 PM. I sometimes go to the gym, but today I am tired. I just want to <span class="vocab-link" onclick="openVocabModal(this, \'Chill\', \'Relax and rest.\', \'What do you do to chill on Sundays?\', \'On Sundays, I chill by...\')">chill</span> on the sofa and watch TV.', 
              defaultFollowUp: 'Read the post aloud to the Director.' },

            { type: 'decoder', title: 'CAPTION DRAFT 1', blocks: ['always', 'I', 'early', 'wake', 'up'], correct: 'I always wake up early', followUpQ: 'Do you wake up early on the weekend?', starter: '"On the weekend, I..."' },
            { type: 'decoder', title: 'CAPTION DRAFT 2', blocks: ['coffee', 'usually', 'I', 'drink'], correct: 'I usually drink coffee', followUpQ: 'Do you drink coffee or tea?', starter: '"I always/sometimes drink..."' },

            // ACT III: System Training & Immersive Shift
            { type: 'shift', title: 'ALGORITHM UPDATE!', desc: 'Warning! To go viral, you must talk about OTHER people (He / She). Prepare for the 3rd Person "S".', bg: 'immersive-shift' },
            
            { type: 'lever', title: 'GRAMMAR FILTER: THE "S"', conceptA: 'Me (I)', textA: 'I wake up early.', conceptB: 'Vlogger (He/She)', textB: 'He wakes up early.', rule: 'Add an "S" or "ES" to the verb when talking about He, She, or It.' },
            { type: 'lever', title: 'GRAMMAR FILTER: NEGATIVE', conceptA: 'Affirmative (Has S)', textA: 'She goes to the gym.', conceptB: 'Negative (No S!)', textB: 'She doesn\'t go to the gym.', rule: 'Use "doesn\'t". The main verb relaxes and loses the S!' },
            
            { type: 'mcqTrial', title: 'TROLL BAN: TEST 1', q: 'My best friend ___ to the gym every day.', options: ['go', 'goes', 'going'], correct: 1, followUpQ: 'Does your best friend go to the gym?', starter: '"Yes, he/she goes... / No, he/she doesn\'t..."' },
            { type: 'mcqTrial', title: 'TROLL BAN: TEST 2', q: 'The vlogger ___ drink coffee.', options: ['don\'t', 'doesn\'t', 'isn\'t'], correct: 1, followUpQ: 'Does your mother drink coffee?', starter: '"Yes, she always... / No, she never..."' },
            
            { type: 'rapidFire', title: 'LIVE STREAM Q&A', q: 'What do you usually do on Sundays?', instruction: 'Read the question from the chat and answer out loud!' },

            // ACT IV: Field Simulation (Output)
            { type: 'qRoulette', title: 'ROUTINE ROULETTE', instruction: 'Spin to receive a random question from your followers.', 
              questions: ['What time do you usually eat dinner?', 'Do you always study English?', 'Where do you sometimes go on the weekend?', 'What do you never eat?'] },
            { type: 'qRoulette', title: 'GOSSIP ROULETTE', instruction: 'Spin to gossip about someone else (Use He/She).', 
              questions: ['What does your best friend usually do on Friday?', 'Does your mother cook every day?', 'What time does your boss arrive?', 'Does your teacher speak Portuguese?'] },
            
            { type: 'pressConference', title: 'COLLAB CALL', reporter: 'Famous YouTuber', prompt: 'Answer the question using an Adverb of Frequency.', q: 'Hey! I want to record a video with you. Do you usually work on the weekends?' },
            { type: 'pressConference', title: 'HATER COMMENT', reporter: 'Troll_99', prompt: 'Defend your friend using a Negative sentence (doesn\'t).', q: 'Your friend is so lazy! He sleeps all day, right?' },
            
            { type: 'crossroads', title: 'SPONSOR DILEMMA', dilemma: 'A brand pays you $10,000, but you must wake up at 4:00 AM every day. Do you accept?', opt1: 'Accept the Money', opt2: 'Sleep is Better' },

            // ACT V: Mission Complete
            { type: 'debate', title: 'DEEP DEBATE: SCREEN TIME', q: 'How many hours do you usually spend on your phone every day?', starter: '"I usually spend about..."' },
            { type: 'debate', title: 'DEEP DEBATE: FAKE LIFE', q: 'Do you think vloggers show their real routine, or is it fake?', starter: '"I think they usually..."' },
            { type: 'debate', title: 'DEEP DEBATE: HABITS', q: 'What is one bad habit you want to stop?', starter: '"I want to never..."' },
            { type: 'homework', title: 'NEW APP DOWNLOAD', desc: 'Your content is ready to post. Use the mobile app to fix more grammar bugs.', appName: 'Vlog Studio Mobile' },
            { type: 'curtain', title: '1 MILLION SUBSCRIBERS', desc: 'You mastered Daily Routines and went viral!' }
        ];

        // --- CORE FUNCTIONS ---
        function initializeSystem() { document.getElementById('loading-screen').classList.add('fade-out'); loadNotes(); render(); }

        function updateHUD() {
            for(let i=1; i<=3; i++) {
                const heart = document.getElementById(`hp-${i}`);
                if(i <= state.hp) heart.classList.replace('fa-heart-crack', 'fa-heart');
                else heart.classList.replace('fa-heart', 'fa-heart-crack');
            }
            document.getElementById('hud-name').innerText = state.studentName;
            document.getElementById('xp-counter').innerText = String(state.xp).padStart(4, '0');
            document.getElementById('page-counter').innerText = `POST ${String(state.step + 1).padStart(2, '0')} / 25`;
            document.getElementById('progress-fill').style.width = `${((state.step + 1) / 25) * 100}%`;
            document.getElementById('btn-prev').disabled = state.step === 0;
            document.getElementById('btn-next').disabled = state.step === 24;
            if(lesson[state.step].bg === 'immersive-shift') document.body.classList.add('immersive-shift');
            else document.body.classList.remove('immersive-shift');
        }

        function nav(dir) { let n = state.step + dir; if(n >= 0 && n < 25) { state.step = n; render(); } }

        function takeDamage() {
            if(state.hp > 0) state.hp--;
            const overlay = document.getElementById('damage-overlay');
            overlay.classList.replace('opacity-0', 'opacity-100');
            document.getElementById('arena').classList.add('damage-shake');
            updateHUD();
            setTimeout(() => { overlay.classList.replace('opacity-100', 'opacity-0'); document.getElementById('arena').classList.remove('damage-shake'); }, 400);
        }

        function triggerPraise(mainText = 'VIRAL!', subText = 'FOLLOWERS +100') {
            const overlay = document.getElementById('praise-overlay');
            document.getElementById('praise-text').innerText = mainText; document.getElementById('praise-sub').innerText = subText;
            state.xp += 100; updateHUD();
            overlay.classList.remove('praise-slide'); void overlay.offsetWidth; overlay.classList.add('praise-slide');
            shootConfetti();
        }

        function toggleTeacherPanel() { document.getElementById('teacher-panel').classList.toggle('open'); }

        const notesEl = document.getElementById('teacher-notes');
        function loadNotes() { const saved = localStorage.getItem('wolfNotes_Vlog'); if(saved) notesEl.value = saved; }
        notesEl.addEventListener('input', () => { localStorage.setItem('wolfNotes_Vlog', notesEl.value); });

        // --- RENDER ENGINE ---
        function render() {
            const container = document.getElementById('step-container');
            const d = lesson[state.step];
            container.innerHTML = ''; updateHUD();
            let content = '';

            switch(d.type) {
                case 'cover':
                    content = `
                        <div class="text-center fade-in">
                            <div class="w-32 h-32 bg-accentBlue rounded-[2rem] flex items-center justify-center mx-auto mb-8 shadow-[0_0_30px_rgba(56,189,248,0.5)]">
                                <i class="fa-solid ${d.icon} text-6xl text-white"></i>
                            </div>
                            <h1 class="font-epic text-6xl md:text-8xl text-textMain tracking-tighter uppercase mb-4">${d.title}</h1>
                            <h2 class="font-ui text-2xl text-accentPink tracking-[0.3em] uppercase mb-8 font-bold">${d.subtitle}</h2>
                            <p class="font-ui text-lg text-textMuted max-w-xl mx-auto ws-panel p-6 rounded-2xl border-t-4 border-accentBlue">${d.desc}</p>
                        </div>`;
                    break;
                case 'idReg':
                    content = `
                        <div class="text-center fade-in w-full max-w-xl mx-auto ws-panel p-12 rounded-[2rem] border-t-4 border-accentPink">
                            <h2 class="font-epic text-4xl text-textMain mb-2">${d.title}</h2>
                            <p class="font-ui text-textMuted mb-8">${d.desc}</p>
                            <div class="relative mb-8">
                                <span class="absolute left-6 top-1/2 -translate-y-1/2 text-2xl text-accentBlue font-epic">@</span>
                                <input type="text" id="id-input" class="w-full bg-bgBase border-2 border-panelHover rounded-2xl p-5 pl-14 font-ui text-xl text-textMain focus:border-accentBlue outline-none font-bold" placeholder="username">
                            </div>
                            <button onclick="registerID()" class="w-full btn-social py-5 text-xl">VERIFY ACCOUNT</button>
                        </div>`;
                    break;
                case 'mcqVibe':

        // --- SPECIFIC MECHANICS LOGIC ---
        
        function registerID() {
            let val = document.getElementById('id-input').value.trim();
            if(val) {
                if(!val.startsWith('@')) val = '@' + val;
                state.studentName = val;
                triggerPraise('VERIFIED!', 'HANDLE CREATED');
                setTimeout(() => nav(1), 1500);
            }
        }

        function checkMCQ(btn, selectedIndex, correctIndex) {
            const container = btn.parentElement;
            Array.from(container.children).forEach(b => b.disabled = true);
            if(selectedIndex === correctIndex || correctIndex === undefined) {
                btn.classList.add('bg-accentBlue/20', 'border-accentBlue');
                btn.querySelector('span').classList.replace('text-textMuted', 'text-accentBlue');
                triggerPraise();
                const fu = document.getElementById('follow-up-box');
                if(fu) fu.classList.remove('hidden');
            } else {
                btn.classList.add('bg-dangerRed/20', 'border-dangerRed', 'text-dangerRed');
                container.children[correctIndex].classList.add('border-accentBlue', 'text-accentBlue');
                takeDamage();
            }
        }

        // NEW: Vocab Interactor for Easy Readers
        function openVocabModal(element, title, def, q, starter) {
            const links = document.querySelectorAll('.vocab-link');
            links.forEach(l => l.classList.remove('active'));
            element.classList.add('active');
            
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-def').innerText = def;
            document.getElementById('modal-q').innerText = `"${q}"`;
            document.getElementById('modal-starter').innerText = `"${starter}"`;
            
            document.getElementById('vocab-modal').classList.remove('hidden');
            triggerPraise('VOCAB LOGGED', 'DIRECTOR PROMPT READY');
            
            // Scroll to it
            setTimeout(() => {
                document.getElementById('vocab-modal').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        let selectedPill = null;
        function selectVocab(el) {
            if(selectedPill) selectedPill.classList.remove('border-accentBlue', 'bg-accentBlue/20');
            selectedPill = el;
            el.classList.add('border-accentBlue', 'bg-accentBlue/20');
        }
        function dropVocab(slot, correctWord) {
            if(!selectedPill) return;
            if(selectedPill.getAttribute('data-word') === correctWord) {
                slot.innerHTML = `<span class="font-epic text-accentBlue font-bold tracking-widest">#${correctWord}</span>`;
                slot.classList.replace('border-dashed', 'border-solid');
                slot.classList.replace('border-panelHover', 'border-accentBlue');
                slot.classList.replace('bg-bgBase', 'bg-accentBlue/10');
                selectedPill.style.display = 'none';
                selectedPill = null;
                const total = document.querySelectorAll('.vocab-drop').length;
                const done = document.querySelectorAll('.vocab-drop.border-accentBlue').length;
                if(total === done) triggerPraise('LINKED!', 'BIO UPDATED');
            } else {
                takeDamage();
            }
        }

        function moveBlock(btn) {
            const ans = document.getElementById('decoder-ans');
            const bank = document.getElementById('decoder-bank');
            if(btn.parentElement === bank) ans.appendChild(btn); else bank.appendChild(btn);
        }
        
        function checkDecoder(correctStr) {
            const current = Array.from(document.getElementById('decoder-ans').children).map(b => b.innerText).join(' ');
            if(current === correctStr) {
                document.getElementById('decoder-ans').classList.replace('border-panelHover', 'border-accentBlue');

            const [ca, ta, cb, tb] = ['lvr-c-a', 'lvr-t-a', 'lvr-c-b', 'lvr-t-b'].map(id => document.getElementById(id));
            if(state.mechanics.leverState) {
                track.classList.add('toggled');
                ca.classList.add('opacity-30'); ta.classList.add('opacity-30');
                cb.classList.remove('opacity-30'); tb.classList.remove('opacity-30');

                cb.classList.add('opacity-30'); tb.classList.add('opacity-30');

        let rouletteSpinning = false;
        function spinRoulette(stepIndex) {
            if(rouletteSpinning) return;
            rouletteSpinning = true;
            const textEl = document.getElementById('roulette-text'); const btn = document.getElementById('spin-btn'); const fu = document.getElementById('roulette-followup');
            const qList = lesson[stepIndex].questions;
            btn.classList.add('opacity-50', 'pointer-events-none'); fu.classList.add('hidden'); textEl.classList.add('text-accentBlue');
            let spins = 0; const maxSpins = 20;
            const interval = setInterval(() => {
                textEl.innerText = qList[Math.floor(Math.random() * qList.length)]; spins++;
                if(spins >= maxSpins) {
                    clearInterval(interval);
                    textEl.innerText = `"${qList[Math.floor(Math.random() * qList.length)]}"`; textEl.classList.remove('text-accentBlue');
                    btn.innerText = "I ANSWERED"; btn.classList.remove('opacity-50', 'pointer-events-none');
                    btn.onclick = () => { fu.classList.remove('hidden'); btn.classList.add('hidden'); triggerPraise('ANSWERED', 'FANS LOVE IT'); };
                    rouletteSpinning = false;
                }
            }, 80);
        }

            const btn = document.getElementById('mic-btn'); const icon = document.getElementById('mic-icon'); const status = document.getElementById('mic-status');
            if(btn.classList.contains('recording')) {
                btn.classList.remove('recording', 'border-dangerRed', 'bg-dangerRed/10'); btn.classList.add('border-accentBlue', 'bg-accentBlue/10');
                icon.classList.replace('fa-stop', 'fa-check'); icon.classList.replace('text-dangerRed', 'text-accentBlue');
                status.innerText = "AUDIO SENT"; status.classList.replace('text-dangerRed', 'text-accentBlue'); status.classList.remove('animate-pulse');
                triggerPraise('SENT!', 'COLLAB SAVED');
            } else if(!btn.classList.contains('border-accentBlue')) {
                btn.classList.add('recording', 'border-dangerRed', 'bg-dangerRed/10'); btn.classList.remove('border-panelHover');
                icon.classList.replace('fa-microphone', 'fa-stop'); icon.classList.replace('text-textMuted', 'text-dangerRed');
                status.innerText = "RECORDING... CLICK TO STOP"; status.classList.add('text-dangerRed', 'animate-pulse');
            }
        }

        // --- CONFETTI ENGINE ---
        function shootConfetti() {
            const cCanvas = document.createElement('canvas'); cCanvas.style.position = 'fixed'; cCanvas.style.inset = 0; cCanvas.style.pointerEvents = 'none'; cCanvas.style.zIndex = 9999; document.body.appendChild(cCanvas);
            const cCtx = cCanvas.getContext('2d'); cCanvas.width = window.innerWidth; cCanvas.height = window.innerHeight;
            const pieces = []; const colors = ['#38BDF8', '#F472B6', '#A855F7', '#FFFFFF'];
            for(let i=0; i<80; i++) pieces.push({ x: cCanvas.width/2, y: cCanvas.height/2+100, vx: (Math.random()-0.5)*25, vy: (Math.random()-1)*20-5, size: Math.random()*10+5, color: colors[Math.floor(Math.random()*colors.length)], rot: Math.random()*360, rotSpeed: (Math.random()-0.5)*10 });
            function animateC() {
                cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height); let active = false;
                pieces.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.rot += p.rotSpeed; if(p.y < cCanvas.height) active = true; cCtx.save(); cCtx.translate(p.x, p.y); cCtx.rotate(p.rot*Math.PI/180); cCtx.fillStyle = p.color; cCtx.beginPath(); cCtx.arc(0, 0, p.size/2, 0, Math.PI*2); cCtx.fill(); cCtx.restore(); });
                if(active) requestAnimationFrame(animateC); else document.body.removeChild(cCanvas);
            }
            animateC();
        }

        window.onload = () => { document.getElementById('page-counter').innerText = `POST 01 / 25`; document.getElementById('hud-name').innerText = state.studentName; };
    </script>
